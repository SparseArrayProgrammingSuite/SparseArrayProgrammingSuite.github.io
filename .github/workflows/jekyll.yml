# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Observable
        run: npm ci
      - name: Test competition data and profile
        run: npm test
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.4' # Bundler 4 requires Ruby 3.2 or newer
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Install draw.io and favicon tools
        run: |
          DRAWIO_VERSION=30.0.4
          curl -L --fail --show-error --silent \
            -o /tmp/drawio.deb \
            "https://github.com/jgraph/drawio-desktop/releases/download/v${DRAWIO_VERSION}/drawio-amd64-${DRAWIO_VERSION}.deb"
          sudo apt-get update
          sudo apt-get install -y xvfb librsvg2-bin imagemagick /tmp/drawio.deb
      - name: Export SAPS logo assets
        run: |
          xvfb-run -a drawio \
            --export \
            --format svg \
            --page-index 1 \
            --crop \
            --transparent \
            --svg-theme light \
            --embed-svg-fonts false \
            --output assets/SAPSIcon.svg \
            SAPS.drawio
          xvfb-run -a drawio \
            --export \
            --format svg \
            --page-index 2 \
            --crop \
            --transparent \
            --svg-theme light \
            --embed-svg-fonts false \
            --output assets/SAPSLogo.svg \
            SAPS.drawio
          ruby -e 'Dir["assets/SAPS*.svg"].each { |path| svg = File.read(path); svg.sub!(/\sstyle="background:\s*transparent;\s*background-color:\s*transparent;\s*color-scheme:[^"]*"/, ""); File.write(path, svg) }'
      - name: Build favicon assets
        run: |
          mkdir -p assets/icons
          rsvg-convert --width 512 --height 512 --keep-aspect-ratio \
            assets/SAPSIcon.svg \
            --output "$RUNNER_TEMP/saps-icon-source.png"
          convert "$RUNNER_TEMP/saps-icon-source.png" -gravity center \
            -background none -extent 512x512 assets/icons/icon-512.png
          convert assets/icons/icon-512.png -resize 180x180 \
            assets/icons/apple-touch-icon.png
          convert assets/icons/icon-512.png -resize 192x192 \
            assets/icons/icon-192.png
          convert assets/icons/icon-512.png -define icon:auto-resize=48,32,16 \
            favicon.ico
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Fetch latest competition data and build Observable leaderboard
        run: npm run build
        env:
          OBSERVABLE_TELEMETRY_DISABLE: '1'
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
